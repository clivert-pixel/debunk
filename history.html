<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>History — Debunk</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#05070d;
color:white;
min-height:100vh;
}

.bg{
position:fixed;
inset:0;
z-index:-1;
background:
radial-gradient(circle at 20% 15%,rgba(80,110,255,.17),transparent 30%),
radial-gradient(circle at 80% 80%,rgba(0,210,170,.1),transparent 30%),
#05070d;
}

nav{
height:72px;
padding:0 7%;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(5,7,13,.6);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:24px;
font-weight:800;
color:white;
text-decoration:none;
}

.logo span{color:#6c8cff}

.links{
display:flex;
gap:8px;
}

.links a{
color:rgba(255,255,255,.65);
text-decoration:none;
padding:9px 13px;
border-radius:10px;
font-size:14px;
}

.links a:hover,
.links a.active{
background:rgba(255,255,255,.08);
color:white;
}

.container{
width:min(900px,92%);
margin:55px auto;
}

h1{
font-size:42px;
letter-spacing:-2px;
margin-bottom:10px;
}

.subtitle{
color:rgba(255,255,255,.55);
margin-bottom:30px;
}

.history{
display:grid;
gap:12px;
}

.item{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
padding:19px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.045);
border-radius:16px;
}

.question{
font-size:15px;
margin-bottom:6px;
}

.date{
font-size:12px;
color:rgba(255,255,255,.4);
}

.result{
font-size:12px;
padding:7px 10px;
border-radius:8px;
background:rgba(108,140,255,.12);
color:#91a7ff;
white-space:nowrap;
}

.empty{
padding:50px 20px;
text-align:center;
border:1px dashed rgba(255,255,255,.12);
border-radius:18px;
color:rgba(255,255,255,.45);
}

@media(max-width:600px){
h1{font-size:34px}

.links a{
font-size:12px;
padding:8px 7px;
}

.item{
align-items:flex-start;
flex-direction:column;
}

.result{
white-space:normal;
}
}
</style>
</head>

<body>

<div class="bg"></div>

<nav>

<a href="index.html" class="logo">
De<span>bunk</span>
</a>

<div class="links">
<a href="index.html">Home</a>
<a href="trending.html">Trending</a>
<a href="history.html" class="active">History</a>
<a href="community.html">Community</a>
</div>

</nav>

<main class="container">

<h1>Your history</h1>

<p class="subtitle">
Questions you've checked on Debunk.
</p>

<div class="history" id="history"></div>

</main>

<script>

const historyBox =
document.getElementById("history");

let history =
JSON.parse(localStorage.getItem("debunkHistory") || "[]");

if(history.length === 0){

historyBox.innerHTML = `
<div class="empty">
<h3>No searches yet</h3>
<p style="margin-top:8px">
Your verified questions will appear here.
</p>
</div>
`;

}else{

history
.slice()
.reverse()
.forEach(item=>{

const div =
document.createElement("div");

div.className="item";

div.innerHTML=`

<div>
<div class="question">
${escapeHTML(item.question || item)}
</div>

<div class="date">
${item.date || "Recently"}
</div>
</div>

<div class="result">
Verified
</div>

`;

historyBox.appendChild(div);

});

}

function escapeHTML(text){

const div=document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

</script>

</body>
</html>
