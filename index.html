<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Debunk — Settle It With Sources</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #05070d;
      color: white;
      overflow-x: hidden;
    }

    /* =========================
       LIVE WALLPAPER BACKGROUND
       ========================= */

    .live-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(70, 110, 255, 0.18), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0, 220, 180, 0.12), transparent 30%),
        #05070d;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: float 14s ease-in-out infinite alternate;
    }

    .orb1 {
      width: 280px;
      height: 280px;
      background: #315cff;
      top: -80px;
      left: -80px;
    }

    .orb2 {
      width: 320px;
      height: 320px;
      background: #00c9a7;
      right: -120px;
      top: 30%;
      animation-delay: -5s;
    }

    .orb3 {
      width: 240px;
      height: 240px;
      background: #743cff;
      bottom: -100px;
      left: 30%;
      animation-delay: -9s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(80px, -50px) scale(1.15);
      }

      100% {
        transform: translate(-50px, 70px) scale(0.9);
      }
    }

    /* Moving grid */
    .grid {
      position: absolute;
      inset: -100%;
      opacity: 0.08;

      background-image:
        linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);

      background-size: 55px 55px;

      transform: perspective(500px) rotateX(60deg);

      animation: gridMove 15s linear infinite;
    }

    @keyframes gridMove {
      from {
        transform:
          perspective(500px)
          rotateX(60deg)
          translateY(0);
      }

      to {
        transform:
          perspective(500px)
          rotateX(60deg)
          translateY(55px);
      }
    }

    /* =========================
       CONTENT
       ========================= */

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
    }

    /* =========================
       NAVBAR
       ========================= */

    nav {
      width: 100%;
      padding: 20px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(5, 7, 13, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(255,255,255,0.08);

      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
      color: white;
    }

    .logo span {
      color: #6c8cff;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 14px;
      transition: 0.25s;
    }

    .nav-links a:hover {
      color: white;
      background: rgba(255,255,255,0.08);
    }

    /* =========================
       HERO
       ========================= */

    .hero {
      min-height: calc(100vh - 75px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 60px 20px 100px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 14px;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;

      background: rgba(255,255,255,0.05);

      color: rgba(255,255,255,0.8);

      font-size: 13px;

      margin-bottom: 25px;

      backdrop-filter: blur(10px);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38e8bd;
      box-shadow: 0 0 12px #38e8bd;
    }

    h1 {
      max-width: 800px;

      font-size: clamp(42px, 8vw, 78px);

      line-height: 0.98;

      letter-spacing: -4px;

      margin-bottom: 22px;
    }

    h1 span {
      background: linear-gradient(
        90deg,
        #ffffff,
        #7895ff,
        #4ce0c2,
        #ffffff
      );

      background-size: 250% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 250% center;
      }
    }

    .subtitle {
      max-width: 620px;

      color: rgba(255,255,255,0.65);

      font-size: 17px;
      line-height: 1.6;

      margin-bottom: 35px;
    }

    /* =========================
       SEARCH
       ========================= */

    .search-box {
      width: min(700px, 100%);

      padding: 7px;

      display: flex;
      gap: 8px;

      background: rgba(255,255,255,0.07);

      border: 1px solid rgba(255,255,255,0.13);

      border-radius: 18px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 20px 80px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.08);
    }

    .search-box input {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      background: transparent;

      color: white;

      font-size: 16px;

      padding: 16px;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .search-box button {
      border: none;

      padding: 0 25px;

      border-radius: 13px;

      background: linear-gradient(
        135deg,
        #5d78ff,
        #7656ff
      );

      color: white;

      font-weight: 700;

      cursor: pointer;

      transition: 0.25s;
    }

    .search-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(90,100,255,0.35);
    }

    /* =========================
       EXAMPLES
       ========================= */

    .examples {
      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;

      max-width: 750px;

      margin-top: 25px;
    }

    .example {
      border: 1px solid rgba(255,255,255,0.1);

      background: rgba(255,255,255,0.045);

      color: rgba(255,255,255,0.65);

      padding: 9px 13px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 12px;

      transition: 0.25s;
    }

    .example:hover {
      color: white;

      background: rgba(255,255,255,0.1);

      transform: translateY(-2px);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {

      nav {
        padding: 17px 5%;
      }

      .nav-links {
        gap: 2px;
      }

      .nav-links a {
        padding: 8px 8px;
        font-size: 12px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 15px;
      }

      .search-box {
        border-radius: 15px;
      }

      .search-box button {
        padding: 0 17px;
      }
    }
  </style>
</head>

<body>

  <!-- LIVE WALLPAPER -->
  <div class="live-bg">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="grid"></div>

  </div>


  <div class="page">

    <!-- NAVIGATION -->

    <nav>

      <a href="index.html" class="logo">
        De<span>bunk</span>
      </a>

      <div class="nav-links">

        <!-- THESE ARE REAL SEPARATE PAGES -->
        <a href="index.html">Home</a>

        <a href="trending.html">Trending</a>

        <a href="history.html">History</a>

        <a href="about.html">About</a>

      </div>

    </nav>


    <!-- HOME PAGE -->

    <main class="hero">

      <div class="badge">
        <span class="badge-dot"></span>
        Search. Verify. Know.
      </div>

      <h1>
        <span>Stop guessing.</span><br>
        Start knowing.
      </h1>

      <p class="subtitle">
        Ask a question, check the evidence, and get an answer
        backed by multiple sources instead of random internet claims.
      </p>


      <!-- SEARCH FORM -->

      <form id="searchForm" class="search-box">

        <input
          id="queryInput"
          type="text"
          placeholder="Ask anything you want to verify..."
          autocomplete="off"
          required
        >

        <button type="submit">
          Debunk
        </button>

      </form>


      <!-- EXAMPLE QUESTIONS -->

      <div class="examples">

        <button
          class="example"
          data-q="Is drinking cold water bad for you?"
        >
          Is cold water bad for you?
        </button>

        <button
          class="example"
          data-q="Does cracking your fingers cause arthritis?"
        >
          Does cracking fingers cause arthritis?
        </button>

        <button
          class="example"
          data-q="Is the Great Wall of China visible from space?"
        >
          Can you see the Great Wall from space?
        </button>

      </div>

    </main>

  </div>


  <script>

    /* =========================
       SEARCH
       ========================= */

    const searchForm =
      document.getElementById("searchForm");

    const queryInput =
      document.getElementById("queryInput");


    searchForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        const question =
          queryInput.value.trim();

        if (!question) return;

        /*
          IMPORTANT:

          Keep your existing search function/API
          here.

          If your existing code already has:

              runSearch(question)

          this will use it.
        */

        if (typeof runSearch === "function") {

          runSearch(question);

        } else {

          /*
            Fallback.

            Sends the user to your existing result page
            if runSearch isn't defined.
          */

          window.location.href =
            "results.html?q=" +
            encodeURIComponent(question);

        }

      }
    );


    /* =========================
       EXAMPLE QUESTIONS
       ========================= */

    document
      .querySelectorAll(".example")
      .forEach(button => {

        button.addEventListener(
          "click",
          function() {

            const question =
              button.dataset.q;

            queryInput.value = question;

            queryInput.focus();

          }
        );

      });

  </script>

</body>
</html>
