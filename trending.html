<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>(function(){try{if(localStorage.getItem('debunk_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trending — Debunk</title>
<link rel="icon" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FAF7F1; --text:#1B1E27; --text-dim:#6B6558; --text-faint:#9A9384;
    --border:#E6E0D4; --accent-teal:#2E8C7E; --accent-red:#D8434B;
  }
  [data-theme="dark"] {
    --bg:#0B0E14; --text:#F2F0EA; --text-dim:#8A93A6; --text-faint:#5B6272;
    --border:#262B36; --accent-teal:#3FA796; --accent-red:#E5484D;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--text); font-family:'Inter',sans-serif; transition: background .25s ease, color .25s ease; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 20px 80px; }
  nav { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:8px 0 34px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .logo span.name { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:24px; }
  .logo span.dot { color: var(--accent-red); font-size:24px; font-weight:800; }
  .navlinks { display:flex; gap:16px; }
  .navlinks a { color: var(--text-dim); text-decoration:none; }
  .navlinks a:hover, .navlinks a.active { color: var(--text); }
  #settingsBtn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 14px; }
  #rightControls { position: relative; }
  .settings-panel { display:none; position:absolute; top:38px; right:0; background: var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; min-width:160px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:40; }
  .switch-row { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; }
  .switch-row input { accent-color: var(--accent-teal); width:34px; height:18px; }
  h1 { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:26px; margin-bottom:8px; }
  p.sub { color: var(--text-faint); font-size:13.5px; margin-bottom:28px; font-family:'IBM Plex Mono',monospace; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .item { display:flex; align-items:center; justify-content:space-between; text-decoration:none; border:1px solid var(--border); border-radius:10px; padding:16px 18px; color: var(--text); }
  .item:hover { border-color: var(--accent-teal); }
  .item .rank { font-family:'IBM Plex Mono',monospace; color: var(--text-faint); margin-right:12px; font-size:13px; }
  .item .arrow { color: var(--text-faint); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="logo"><span class="name">DEBUNK</span><span class="dot">.</span></div>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="trending.html" class="active">Trending</a>
      <a href="history.html">History</a>
      <a href="about.html">About</a>
    </div>
    <div id="rightControls">
      <button id="settingsBtn" onclick="toggleSettings()">⚙️</button>
      <div id="settingsPanel" class="settings-panel">
        <label class="switch-row">
          <span>Dark mode</span>
          <input type="checkbox" id="darkToggle" onchange="toggleTheme()">
        </label>
      </div>
    </div>
  </nav>

  <h1>Trending debates</h1>
  <p class="sub">A running list of popular questions people are settling. Tap one to see the verdict.</p>

  <div class="list" id="list"></div>
</div>

<script>
  const TRENDING = [
    "Who is the richest man alive?",
    "Fastest 100m sprint time ever",
    "Has Messi won a World Cup?",
    "Tallest building in the world",
    "Is coffee bad for you?",
    "Who has the most Grammy awards?",
    "What is the biggest company in the world by market cap?",
    "Did Ronaldo score more goals than Messi?",
  ];
  const list = document.getElementById('list');
  TRENDING.forEach((q, i) => {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = 'index.html?q=' + encodeURIComponent(q);
    a.innerHTML = `<span><span class="rank">#${i+1}</span>${q}</span><span class="arrow">&#8594;</span>`;
    list.appendChild(a);
  });

  function toggleSettings(){
    const panel = document.getElementById('settingsPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  }
  function toggleTheme(){
    const checked = document.getElementById('darkToggle').checked;
    if (checked) { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('debunk_theme','dark'); }
    else { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('debunk_theme','light'); }
  }
  document.getElementById('darkToggle').checked = document.documentElement.getAttribute('data-theme') === 'dark';
  document.addEventListener('click', (e) => {
    const wrap = document.getElementById('rightControls');
    if (!wrap.contains(e.target)) document.getElementById('settingsPanel').style.display = 'none';
  });
</script>
</body>
</html>
